name: Calcular relevo das praias

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relevo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/relevo.py
      - name: Salvar no site
        run: |
          git config user.name "robo-praiometro"
          git config user.email "robo-praiometro@users.noreply.github.com"
          git add data/horizontes.json
          git diff --cached --quiet || (git commit -m "Relevo das praias" && git pull --rebase && git push)
