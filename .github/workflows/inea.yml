# Robô da água (INEA): lê o portal novo do INEA (SEIRHI) e atualiza data/balneabilidade.json.
# Roda no computador do Praiômetro (runner próprio, Windows), porque o INEA só responde para máquinas no Brasil.
# Se o computador estiver desligado, a tarefa espera na fila até ele ligar (até 24 horas).
name: Atualizar água (INEA)

on:
  schedule:
    - cron: "23 13,21 * * *"    # todo dia, 10h23 e 18h23 em Brasília (o INEA atualiza às terças e sextas)
  workflow_dispatch:            # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: inea
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/inea_portal.py
      - name: Salvar no site
        shell: bash
        run: |
          git config user.name "robo-praiometro"
          git config user.email "robo-praiometro@users.noreply.github.com"
          git add data/balneabilidade.json
          git diff --cached --quiet && exit 0
          git commit -m "Água (INEA)"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 15; done
          exit 1
