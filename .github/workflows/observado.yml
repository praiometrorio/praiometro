name: Céu observado (aeroportos)

on:
  schedule:
    - cron: "7,37 8-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  observado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/observado.py
      - name: Salvar no site
        run: |
          git config user.name "robo-praiometro"
          git config user.email "robo-praiometro@users.noreply.github.com"
          git add data/observado.json
          git diff --cached --quiet || (git commit -m "Céu observado" && git pull --rebase && git push)
