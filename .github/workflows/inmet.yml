# Robô das estações do INMET: de hora em hora, das 5h às 19h, guarda temperatura, umidade e vento MEDIDOS perto das praias.
# Roda no computador do Praiômetro (runner próprio, Windows): a API do INMET é pública e sem chave,
# mas só responde para máquinas no Brasil (igual ao INEA e aos pluviômetros).
name: Estações do INMET

on:
  schedule:
    - cron: "19 8-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inmet
  cancel-in-progress: false

jobs:
  inmet:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/inmet.py
      - name: Salvar no site
        shell: bash
        run: |
          git config user.name "robo-praiometro"
          git config user.email "robo-praiometro@users.noreply.github.com"
          git add data/inmet.json
          git diff --cached --quiet && exit 0
          git commit -m "Estações do INMET"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 15; done
          exit 1
